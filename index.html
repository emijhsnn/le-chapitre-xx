<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Le Chapitre XX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--nuit:#111827;--foret:#203B35;--bordeaux:#512D39;--or:#C6A875;--parch:#EFE3CA;--ivoire:#F9F3E9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--nuit);color:var(--ivoire);font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1.55}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#hud{position:fixed;top:0;left:0;right:0;z-index:20;padding:env(safe-area-inset-top,0) 12px 0;background:linear-gradient(#111827ee,#11182700)}
.track{height:2px;background:#ffffff14;margin-top:6px}#bar{height:100%;width:0;background:var(--or);transition:width 1.2s}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 0}
.chip{font:500 12px Inter,sans-serif;color:var(--or);background:#11182799;border:1px solid #C6A87555;border-radius:20px;padding:8px 12px;min-height:36px}
.btn{font:500 14px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--nuit);background:var(--or);border:0;border-radius:2px;padding:16px 26px;min-height:48px;cursor:pointer;box-shadow:0 0 24px #C6A87544;transition:transform .2s,box-shadow .2s}
.btn:hover{box-shadow:0 0 36px #C6A87588}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.link{background:none;border:0;color:var(--or);font:italic 18px 'Cormorant Garamond',serif;text-decoration:underline;padding:12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--or);outline-offset:3px}
#stage{position:relative;z-index:5;min-height:100vh;display:flex;justify-content:center;padding:84px 18px 60px;transition:background 1.5s}
#stage[data-bg=gate]{background:radial-gradient(ellipse at 50% 30%,#2a3b55,#111827 70%)}
#stage[data-bg=hall]{background:linear-gradient(#203B35,#111827)}
#stage[data-bg=desk]{background:radial-gradient(circle at 50% 70%,#512D3977,#111827 70%)}
#stage[data-bg=circle]{background:radial-gradient(circle at 50% 40%,#203B35,#111827 75%)}
#stage[data-bg=wall]{background:linear-gradient(135deg,#3a2530,#111827 60%)}
#stage[data-bg=portal]{background:radial-gradient(circle at 50% 45%,#C6A87555,#111827 60%)}
.scene,.intro{width:100%;max-width:560px;text-align:center;position:relative;animation:in 1.4s both}
@keyframes in{from{opacity:0}}
h1,h2{font-family:Cinzel,serif;letter-spacing:.12em;color:var(--or);font-weight:700;margin:.2em 0}
h2{font-size:21px}h3{font-family:Cinzel,serif;color:var(--or)}
.guard{font:italic 17px 'Cormorant Garamond',serif;color:#C6A875cc;margin:0}
.narr{font-size:21px;margin:14px 0 22px}
.parch{background:var(--parch);color:#2b1d14;border-radius:3px;padding:20px 22px;text-align:left;box-shadow:inset 0 0 40px #8a6a3a55,0 8px 30px #0008;margin:14px 0;font-size:21px}
.parch p{margin:.3em 0}
input[type=text]{width:100%;font:500 18px Inter,sans-serif;text-align:center;letter-spacing:.2em;text-transform:uppercase;color:var(--ivoire);background:#0006;border:1px solid var(--or);border-radius:2px;padding:14px;margin:12px 0}
#err{color:#e8a0a8;min-height:1.5em;font-style:italic}#hh{font-style:italic;color:#C6A875}
.shake{animation:shake .5s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ok{box-shadow:inset 0 0 160px #C6A87577}
.veil{position:fixed;inset:0;z-index:30;background:#111827ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:30px;text-align:center;font-size:23px;animation:in 1.2s both}
.veil p{max-width:480px}
/* livre */
.bookwrap{perspective:1200px;margin:60px auto 24px;width:230px;height:320px}
.book{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.8s}
.cover{position:absolute;inset:0;transform-origin:left;transition:transform 1.8s cubic-bezier(.6,0,.2,1);backface-visibility:hidden;background:linear-gradient(135deg,#512D39,#2c1620);border:2px solid var(--or);border-radius:3px 8px 8px 3px;box-shadow:0 20px 60px #000,inset 0 0 40px #0009;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;animation:glow 4s infinite alternate}
@keyframes glow{to{box-shadow:0 20px 60px #000,0 0 50px #C6A87555,inset 0 0 40px #0009}}
.cover h1{font-size:22px;border-bottom:1px solid var(--or);padding-bottom:12px}
.cover .nm{font:italic 22px 'Cormorant Garamond',serif;color:var(--parch);min-height:1.5em}
.cover .sub{font-size:14px;color:#C6A875cc;font-style:italic}
.inside{position:absolute;inset:0;background:var(--parch);border-radius:3px 8px 8px 3px;box-shadow:inset 12px 0 30px #8a6a3a66}
.open .cover{transform:rotateY(-170deg)}
.lines p{opacity:0;animation:in 2s forwards;margin:.9em 0}
/* portes */
.door{height:170px;display:flex;margin:0 auto 10px;width:230px;border:3px solid var(--or);border-bottom:0;border-radius:115px 115px 0 0;overflow:hidden;background:radial-gradient(#C6A875,#fff0)}
.door>div{flex:1;background:linear-gradient(#2c1620,#512D39);transition:transform 1.6s}.door>div:first-child{border-right:1px solid var(--or)}
.door.open>div:first-child{transform:translateX(-100%)}.door.open>div:last-child{transform:translateX(100%)}
/* ouvrages */
#books{list-style:none;padding:0;margin:0 0 14px;touch-action:pan-y}
#books li{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#512D39,#203B35);border:1px solid var(--or);border-radius:3px;padding:10px 12px;margin:10px 0;text-align:left;animation:float 5s ease-in-out infinite}
#books li:nth-child(2n){animation-delay:-2.5s}@keyframes float{50%{transform:translateY(-4px)}}
#books li.drag{box-shadow:0 0 30px var(--or);opacity:.85}
#books .t{flex:1}#books .y{font:12px Inter,sans-serif;color:var(--or)}
#books .h{touch-action:none;cursor:grab;color:var(--or);font-size:24px;padding:4px 8px}
#books .mv{font:14px Inter,sans-serif;background:#0005;color:var(--or);border:1px solid #C6A87566;border-radius:3px;width:38px;height:38px}
#books .l{font:700 20px Cinzel;color:var(--or);width:24px}
.nightveil{position:fixed;inset:0;background:#05080f;opacity:0;pointer-events:none;transition:opacity 2.5s;z-index:2}.night .nightveil{opacity:.7}
.secret{margin:12px auto;padding:14px;border:1px dashed var(--or);color:var(--or);animation:in 2s both}
/* lettre */
.cipher{font:700 20px Cinzel;letter-spacing:.2em;color:#512D39}
.wheel{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;font:14px Inter,sans-serif}
.wheel .chip{font-size:20px;width:48px}
.seal{width:70px;height:70px;margin:8px auto;cursor:pointer}
.corner{position:relative;margin:10px auto;width:100%;height:120px;background:var(--parch);border-radius:3px;overflow:hidden;color:#2b1d14;cursor:grab}
.corner::after{content:"";position:absolute;right:0;bottom:0;width:56px;height:56px;background:linear-gradient(135deg,#bfa77b 50%,#00000000 50%);transition:all .8s;box-shadow:-4px -4px 10px #0004}
.corner.lift::after{width:150px;height:110px}
.corner svg{width:60px;height:60px;position:absolute;left:calc(50% - 30px);top:30px;opacity:0;transition:opacity 1s .6s}.corner.lift svg{opacity:1}
/* gardiens */
.statues{display:flex;gap:8px;justify-content:center}
.st{flex:1;border:1px solid #C6A87544;border-radius:3px;padding:8px 4px;color:#ffffff22;background:#0004;font:13px Inter,sans-serif;transition:all 1.2s;cursor:pointer;min-height:170px}
.st svg{width:48px;height:72px}.st .slot{height:36px;margin-top:6px}.st .slot svg{width:34px;height:34px}
.st.on{color:var(--or);box-shadow:0 0 30px #C6A87588;background:#C6A87522}.st.sel{border-color:var(--or)}
.objs{display:flex;gap:10px;justify-content:center;margin:16px 0}
.obj{background:#0006;border:1px solid var(--or);color:var(--or);border-radius:3px;padding:8px 14px;font:13px Inter,sans-serif;min-height:48px}.obj svg{width:30px;height:30px;display:block;margin:auto}
.obj.sel{background:#C6A87533}.obj.used{opacity:.4}
.clues{text-align:left;font-size:19px}
/* fragments */
#line{min-height:90px;border:1px dashed var(--or);padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-bottom:16px}
#pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:60px}
.frag{background:var(--parch);color:#2b1d14;border:0;padding:12px 16px;font:21px 'Cormorant Garamond',serif;clip-path:polygon(0 8%,6% 0,100% 4%,96% 100%,4% 95%);min-height:48px;animation:float 5s ease-in-out infinite}
.done .frag{animation:none;box-shadow:0 0 20px var(--or);transition:all 1s}
.portal{width:120px;height:160px;margin:14px auto;border-radius:60px;background:radial-gradient(#fff6e0,#C6A875 40%,#512D39);box-shadow:0 0 60px #C6A875;animation:pulse 3s infinite alternate}
@keyframes pulse{to{transform:scale(1.08);box-shadow:0 0 100px #C6A875}}
.rv{opacity:0;animation:in 2.4s forwards;margin:.8em 0}
.big{font:700 24px Cinzel;color:var(--or);letter-spacing:.2em}
.shut{width:150px;height:200px;margin:30px auto;background:linear-gradient(135deg,#512D39,#2c1620);border:2px solid var(--or);animation:shut 3s both}
@keyframes shut{from{transform:perspective(600px) rotateY(60deg);opacity:0}}
#modal{position:fixed;inset:0;z-index:40;background:#000c;display:flex;align-items:center;justify-content:center;padding:18px}#modal[hidden]{display:none}
.sheet{background:var(--nuit);border:1px solid var(--or);padding:22px;max-width:500px;width:100%;max-height:80vh;overflow:auto;text-align:center}
.sheet .it{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0}.sheet svg{width:36px;height:36px;flex:none}
.sheet blockquote{margin:12px 0;padding-left:12px;border-left:2px solid var(--or);text-align:left}
#dev{position:fixed;bottom:0;left:0;z-index:50;background:#000;padding:4px;font:11px Inter}#dev button{font-size:11px;margin:1px}
.calm *,.calm *::before,.calm *::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}

const $ = (s, e = document) => e.querySelector(s);
const ic = n => `<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const safe = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/gi, "").toUpperCase();
let S = { name: "", ch: 0, j: [], inv: [], stage: "intro", calm: false, seals: [], mirror: false };
try { Object.assign(S, JSON.parse(localStorage.getItem("chapitreXX-v2") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("chapitreXX-v2", JSON.stringify(S)); } catch (e) {} };
let poll;
// Les fonctions de développement ne sont actives qu’en fichier local.

/* ===== SON (facultatif) ===== */
let AC, pad, soundOn = false;
function toggleSound() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    pad = AC.createGain(); pad.gain.value = 0; pad.connect(AC.destination);
    [110, 164.8, 220.5].forEach(f => { const o = AC.createOscillator(); o.frequency.value = f; o.connect(pad); o.start(); });
  }
  soundOn = !soundOn; AC.resume();
  pad.gain.setTargetAtTime(soundOn ? .04 : 0, AC.currentTime, .5);
  $("#bs").textContent = "Son : " + (soundOn ? "oui" : "non"); $("#bs").setAttribute("aria-pressed", soundOn);
}
function chime() {
  if (!soundOn) return;
  const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 880;
  g.gain.setValueAtTime(.1, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + 1.6);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 1.6);
}

/* ===== POUSSIÈRE D'OR ===== */
(function () {
  const c = $("#dust"), x = c.getContext("2d"); let w, h, P = [];
  const size = () => { w = c.width = innerWidth; h = c.height = innerHeight; };
  size(); addEventListener("resize", size);
  for (let i = 0; i < 55; i++) P.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.8 + .4, v: Math.random() * .0004 + .0001, a: Math.random() });
  (function f() {
    x.clearRect(0, 0, w, h);
    P.forEach(p => { p.y -= p.v; p.a += .01; if (p.y < 0) p.y = 1;
      x.fillStyle = `rgba(198,168,117,${.25 + .35 * Math.sin(p.a)})`; x.beginPath(); x.arc(p.x * w, p.y * h, p.r, 0, 6.3); x.fill(); });
    if (!S.calm) requestAnimationFrame(f); else setTimeout(f, 500);
  })();
})();

/* ===== RENDU ===== */
function render() {
  clearInterval(poll);
  const st = $("#stage"); st.className = ""; st.removeAttribute("data-bg"); st.innerHTML = "";
  document.body.classList.toggle("calm", S.calm);
  $("#bc").textContent = "Calme : " + (S.calm ? "oui" : "non"); $("#bc").setAttribute("aria-pressed", S.calm);
  $("#bar").style.width = (S.stage === "intro" ? 0 : S.stage === "play" ? S.ch / 6 * 100 : 100) + "%";
  ({ intro, hall, play, travel, end })[S.stage]();
  scrollTo(0, 0);
}

function intro() {
  $("#stage").dataset.bg="hall";
  $("#stage").innerHTML = `<div class="intro">
    <div class="bookwrap"><div class="book" id="book"><div class="inside"></div><div class="cover"><h1>LE CHAPITRE XX</h1><p class="nm" id="nm">${safe(S.name)}</p><p class="sub">« Certaines histoires attendent le bon moment pour être écrites. »</p></div></div></div>
    <div id="pre"><input type="text" id="name" maxlength="24" placeholder="Ton prénom" value="${safe(S.name)}" autocomplete="given-name" autocapitalize="words" style="text-transform:none;letter-spacing:.05em">
    <button class="btn" id="open">Ouvrir le livre</button></div><div class="lines" id="lines"></div></div>`;
  $("#name").oninput = e => { $("#nm").textContent = e.target.value.trim(); };
  $("#open").onclick = () => {
    const n = $("#name").value.trim();

    $("#book").classList.add("open"); $("#pre").remove();

      `<button class="btn" id="enter" style="opacity:0;animation:in 2s ${2 + CFG.intro.length * 2.4}s forwards">Entrer dans la bibliothèque</button>`;
    $("#enter").onclick = () => { S.stage = "hall"; S.ch = 0; save(); render(); };
  };
}

function hall() {
 const names=["La porte des mots", "La salle de la Lune", "Le bureau du Scribe", "L’horloge des souvenirs", "La salle interdite", "Le passage entre les mondes"];
 const symbols=["✦","☾","⚿","⌛","◇","✧"];
 const next=Math.min(S.ch,5);
 $("#stage").dataset.bg="hall";
 $("#stage").innerHTML=`<section class="scene hub"><p class="eyebrow">LA BIBLIOTHÈQUE DES HISTOIRES INACHEVÉES</p><h1>Les six salles</h1><p class="narr">« ${safe(S.name)}, les archives ont reconnu ton livre. Chaque salle protège une part du mystère. »</p><div class="lore-card"><div class="guardian-glyph">✧</div><p><strong>Aelion, le Bibliothécaire</strong></p><p>Quatre sceaux te permettront d'accéder à la salle où se trouve la trace du vingtième chapitre.</p></div><div class="seals">${["Mémoire","Lune","Passage","Temps"].map((x,i)=>`<div class="seal-token ${S.seals.includes(x)?'owned':''}"><span>${['✥','☾','⚿','⌛'][i]}</span><small>${x}</small></div>`).join('')}</div><div class="room-grid">${names.map((n,i)=>`<button class="room ${i===next?'active':''}" data-i="${i}" ${i>next?'disabled':''}><span>${symbols[i]}</span><small>CHAPITRE ${['I','II','III','IV','V','VI'][i]}</small><strong>${n}</strong><em>${i<next?'Explorée':i===next?'Entrer':'Verrouillée'}</em></button>`).join('')}</div></section>`;
 document.querySelectorAll('.room:not(:disabled)').forEach(b=>b.onclick=()=>{ S.ch=+b.dataset.i; S.stage="play"; save(); render();});
}
function play() {
  const i = S.ch, c = CFG.ch[i], st = $("#stage"); st.dataset.bg = c.bg;
  if (i === 5) return passage(c);
  st.innerHTML = `<section class="scene"><button class="back-link" id="back">← Retour au hall</button><p class="eyebrow">LE CHAPITRE XX • ${["I","II","III","IV","V"][i]}</p><h2>${c.t}</h2><p class="guard">${c.g}</p><p class="narr">${c.txt}</p><div id="box"></div><p id="err" aria-live="polite"></p><button class="link" id="hint">Demander un indice</button><p id="hh"></p></section>`;
  $("#back").onclick=()=>{S.stage="hall";save();render();};
  let h = 0;
  $("#hint").onclick = () => { $("#hh").textContent = c.hints[Math.min(h++, c.hints.length - 1)]; };
  R[i]($("#box"), c);
}
function fail() {
  $("#err").textContent = CFG.errs[Math.random() * 3 | 0];
  const b = $("#box"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
}
function win(delay = 1400) {
  const i = S.ch, c = CFG.ch[i];
  const name=["Mémoire","Lune","Passage","Temps"][i];
  if (name && !S.seals.includes(name)) S.seals.push(name);
  if (!S.j.includes(c.page)) S.j.push(c.page);
  if (c.item && !S.inv.some(x => x[1] === c.item[1])) S.inv.push(c.item);
  save(); chime(); $("#stage").classList.add("ok");
  setTimeout(() => {
    const o = document.createElement("div"); o.className = "veil";
    o.innerHTML = `<div class="reward-symbol">${["✥","☾","⚿","⌛","◇"][i]}</div><p>${c.win}</p>${i<4?`<p class="earned">Sceau de ${name} obtenu</p>`:""}<button class="btn" id="go">Retourner au hall</button>`;
    document.body.append(o);
    $("#go").onclick = () => { o.remove(); S.ch = Math.max(S.ch,i + 1); S.stage="hall"; save(); render(); };
  }, delay);
}

/* ===== ÉNIGMES ===== */
const R = [
  /* I — acrostiche */
  (b, c) => {
    b.innerHTML = `<div class="door" id="door"><div></div><div></div></div><div class="parch">${c.lines.map(l => `<p>${l}</p>`).join("")}</div>
      <input type="text" id="a" placeholder="Le mot gravé" autocomplete="off" autocapitalize="characters"><button class="btn" id="ok">Prononcer le mot</button>`;
    $("#ok").onclick = () => norm($("#a").value) === c.sol ? ($("#door").classList.add("open"), win(2200)) : fail();
  },
  /* II — ordre chronologique */
  (b, c) => {
    b.innerHTML = `<div class="scene-illustration"><span class="scene-symbol">☾</span><p>La salle des livres flottants</p></div><ul id="books">${c.books.map(([t, y, l]) => `<li data-y="${y}"><span class="h" aria-hidden="true">≡</span><span class="t">${t}<br><span class="y">${y}</span></span><span class="l">${l}</span><button class="mv" data-d="-1" aria-label="Monter">↑</button><button class="mv" data-d="1" aria-label="Descendre">↓</button></li>`).join("")}</ul><button class="btn" id="ok">Sceller l’ordre</button>`;
    const ul = $("#books");
    ul.onclick = e => {
      const m = e.target.closest(".mv"); if (!m) return; const li = m.closest("li");
      m.dataset.d < 0 ? li.previousElementSibling && ul.insertBefore(li, li.previousElementSibling) : li.nextElementSibling && ul.insertBefore(li.nextElementSibling, li);
    };
    ul.onpointerdown = e => {
      const h = e.target.closest(".h"); if (!h) return; const li = h.closest("li"); li.classList.add("drag"); h.setPointerCapture(e.pointerId);
      h.onpointermove = ev => {
        const o = document.elementFromPoint(ev.clientX, ev.clientY), t = o && o.closest("#books li");
        if (t && t !== li) { const r = t.getBoundingClientRect(); ul.insertBefore(li, ev.clientY < r.top + r.height / 2 ? t : t.nextSibling); }
      };
      h.onpointerup = () => { li.classList.remove("drag"); h.onpointermove = h.onpointerup = null; };
    };
    $("#ok").onclick = () => {
      const y = [...ul.children].map(l => +l.dataset.y);
      if (y.every((v, k) => !k || y[k - 1] < v)) {
        const n = document.createElement("div"); n.className = "nightveil"; document.body.append(n);
        requestAnimationFrame(() => document.body.classList.add("night")); $("#err").innerHTML = "";
        b.insertAdjacentHTML("beforeend", `<p class="big">LUNE</p><div class="secret">Une lueur argentée traverse la salle.</div>`);
        setTimeout(() => { n.remove(); document.body.classList.remove("night"); }, 5200);
        setTimeout(()=>{b.insertAdjacentHTML("beforeend",`<div class="lore-card"><p>Lyra : « La lune a trouvé sa place. Oriente le miroir pour que son reflet touche la serrure. »</p><div class="mirror-stage"><span class="moonbeam">☾</span><button id="mirror" class="mirror" aria-label="Tourner le miroir">◈</button><span class="moonlock">♧</span></div><p id="mirrorstate">Position du miroir : 1 / 3</p><button class="btn" id="mirrorcheck">Diriger la lumière</button></div>`);let pos=0;$("#mirror").onclick=()=>{pos=(pos+1)%3;$("#mirror").style.transform=`rotate(${pos*45}deg)`;$("#mirrorstate").textContent=`Position du miroir : ${pos+1} / 3`;};$("#mirrorcheck").onclick=()=>pos===1?win(1300):fail();},700);
      } else fail();
    };
  },
  /* III — César + page soulevée */
  (b, c) => {
    let sh = 0; const dec = (s, k) => s.replace(/[A-Z]/g, ch => String.fromCharCode((ch.charCodeAt(0) - 65 - k + 26) % 26 + 65));
    b.innerHTML = `<div id="sl"><svg class="seal" id="seal" role="button" tabindex="0" aria-label="Briser le sceau"><use href="#i-seal"/></svg><p><em>Touche le sceau pour l’ouvrir.</em></p></div>
      <div id="let" hidden><div class="parch"><p class="cipher" id="cp">${c.cipher}</p><p><em>${c.clue}</em></p>
      <div class="wheel"><button class="chip" id="m" aria-label="Reculer d’un cran">−</button><span>Reculer de <b id="n">0</b> pas</span><button class="chip" id="p" aria-label="Avancer d’un cran">+</button></div></div>
      <input type="text" id="a" placeholder="Le message en clair" autocomplete="off" autocapitalize="characters"><button class="btn" id="ok">Lire le message</button></div>`;
    const br = () => { $("#sl").hidden = true; $("#let").hidden = false; };
    $("#seal").onclick = br; $("#seal").onkeydown = e => e.key === "Enter" && br();
    const up = d => { sh = (sh + d + 26) % 26; $("#n").textContent = sh; $("#cp").textContent = dec(c.cipher, sh); };
    $("#m").onclick = () => up(1); $("#p").onclick = () => up(-1);
    $("#ok").onclick = () => {
      if (norm($("#a").value) !== norm(c.sol)) return fail();
      $("#let").hidden = true; $("#err").textContent = "";
      b.insertAdjacentHTML("beforeend", `<div class="corner" id="co" role="button" tabindex="0" aria-label="Soulever le coin de la page"><p style="margin:18px">Soulève le coin de la page.</p>${ic("key")}</div>`);
      const co = $("#co"); let x0 = null, done = false;
      const lift = () => { if (done) return; done = true; co.classList.add("lift"); setTimeout(()=>{b.insertAdjacentHTML("beforeend",`<div class="lore-card"><p>Une clé ancienne apparaît. Sélectionne-la pour ouvrir le coffre du Scribe.</p><button class="obj" id="keypick">⚿ Prendre la clé</button><button class="obj" id="chest" disabled>▣ Coffre verrouillé</button></div>`);$("#keypick").onclick=()=>{$("#chest").disabled=false;$("#keypick").textContent="Clé sélectionnée";};$("#chest").onclick=()=>win(500);},950); };
      co.onclick = lift; co.onkeydown = e => e.key === "Enter" && lift();
      co.onpointerdown = e => x0 = e.clientX + e.clientY; co.onpointermove = e => x0 !== null && Math.abs(e.clientX + e.clientY - x0) > 25 && lift();
    };
  },
  /* IV — l'horloge des souvenirs */
  (b,c) => {
    const events=[{t:"Le Scribe quitte son bureau",h:"08:00",k:1},{t:"Edran ferme la salle",h:"12:00",k:3},{t:"Aelion ouvre la bibliothèque",h:"06:00",k:0},{t:"Lyra allume les chandeliers",h:"11:00",k:2}];
    let ord=[0,1,2,3]; let stage=0;
    b.innerHTML=`<div class="clock-art"><div class="clock-hand"></div><span>✧</span></div><div class="parch"><p>Au lever du jour, à <b>06:00</b>, Aelion ouvre la bibliothèque.</p><p>Deux heures plus tard, le Scribe quitte son bureau.</p><p>Une heure avant midi, Lyra allume les chandeliers.</p><p>À midi, Edran ferme la salle.</p></div><p>Remets les quatre événements dans l'ordre.</p><div id="clock-events"></div><button class="btn" id="clock-check">Rétablir le temps</button>`;
    const draw=()=>{$("#clock-events").innerHTML=ord.map((id,i)=>`<div class="event-row"><span>${events[id].t}</span><button data-ix="${i}" data-dir="-1" aria-label="Monter">↑</button><button data-ix="${i}" data-dir="1" aria-label="Descendre">↓</button></div>`).join('');};
    $("#clock-events").onclick=e=>{const k=e.target.closest('button');if(!k)return;const i=+k.dataset.ix,j=i+(+k.dataset.dir);if(j<0||j>3)return;[ord[i],ord[j]]=[ord[j],ord[i]];draw();};draw();
    $("#clock-check").onclick=()=>{if(ord.map(i=>events[i].k).join('')!=="0123")return fail();b.innerHTML=`<div class="clock-art alive"><div class="clock-hand"></div><span>✧</span></div><div class="parch">« Le premier lever et la dernière fermeture sont les bornes du temps. »</div><input id="time-code" type="text" inputmode="numeric" maxlength="4" placeholder="Code à 4 chiffres"><button class="btn" id="time-ok">Ouvrir le cadran</button>`;$("#time-ok").onclick=()=>$("#time-code").value.trim()==="0612"?win(1000):fail();};
  },
  /* V — fragments */
  (b, c) => {
    let placed = []; const order = [3, 0, 4, 1, 2];
    b.innerHTML = `<div id="line" aria-label="Phrase en cours"></div><div id="pool"></div>`;
    const draw = () => {
      $("#line").innerHTML = placed.map(i => `<button class="frag" data-i="${i}">${c.frags[i]}</button>`).join("") || "<em>Touche les fragments…</em>";
      $("#pool").innerHTML = order.filter(i => !placed.includes(i)).map(i => `<button class="frag" data-i="${i}">${c.frags[i]}</button>`).join("");
      if (placed.length === c.frags.length) {
        if (placed.map(i => c.frags[i]).join(" ") === c.sol) { b.classList.add("done"); b.insertAdjacentHTML("beforeend", `<div class="portal"></div>`); win(3200); } else { fail(); setTimeout(() => { placed = []; draw(); }, 900); }
      }
    };
    b.onclick = e => { const f = e.target.closest(".frag"); if (!f || b.classList.contains("done")) return; const i = +f.dataset.i; placed = placed.includes(i) ? placed.filter(x => x !== i) : [...placed, i]; draw(); };
    draw();
  }
];

/* ===== VI — PASSAGE ===== */
function passage(c) {
  if(S.seals.length < 4){S.stage="hall";save();render();return;}
  $("#stage").innerHTML = `<section class="scene"><h2>${c.t}</h2><div>${c.lines.map((l, i) => `<p class="rv" style="animation-delay:${i * 3}s">${l}</p>`).join("")}</div>
    <p class="big rv" style="animation-delay:${c.lines.length * 3}s">LE PASSAGE EST PRÊT.</p>
    <div class="rv" style="animation-delay:${c.lines.length * 3 + 2}s"><p><em>La prochaine étape commencera lorsque le passage sera prêt.</em></p>
    <input type="text" id="a" placeholder="Mot d’ouverture" autocomplete="off" autocapitalize="characters"><button class="btn" id="ok">Ouvrir le passage</button><p id="err"></p></div></section>`;
  if (!S.j.includes(c.page)) { S.j.push(c.page); save(); }
  const go = () => { S.stage = "travel"; save(); render(); };
  $("#ok").onclick = () => norm($("#a").value) === norm(CFG.passageCode) ? go() : ($("#err").textContent = "Le passage reste fermé pour le moment.");
  if (CFG.remoteUrl) poll = setInterval(() => fetch(CFG.remoteUrl, { cache: "no-store" }).then(r => r.json()).then(d => d.open && go()).catch(() => {}), 10000);
}

function travel() {
  $("#stage").dataset.bg="portal";
  $("#stage").innerHTML = `<section class="scene travel-scene"><div class="shut"></div><p class="eyebrow">LE CHAPITRE XX</p><h2>Le livre se referme.</h2><p class="narr">La dernière page se trouve au-delà des murs de la bibliothèque.</p><p class="narr">Suis simplement les indications de ton guide. La suite de l'histoire t'attend dans le monde réel.</p><p class="guard">Tu peux maintenant ranger ton téléphone.</p></section>`;
}
function end() {
  $("#stage").innerHTML = `<section class="scene" style="margin-top:20vh"><p class="narr">Tu as retrouvé le dernier chapitre.</p><p class="narr rv" style="animation-delay:3s">À présent, le livre peut être refermé.</p><p class="big rv" style="animation-delay:6s">FIN.</p></section>`;
}

/* ===== JOURNAL / SACOCHE / RÉGLAGES ===== */
function modal(t, h) { $("#mt").textContent = t; $("#mb").innerHTML = h; $("#modal").hidden = false; $("#mx").focus(); }
$("#bj").onclick = () => modal("Journal", S.j.length ? S.j.map(x => `<blockquote>${x}</blockquote>`).join("") : "<p><em>Aucune page découverte.</em></p>");
$("#bi").onclick = () => modal("Sacoche", S.inv.length ? S.inv.map(([i, n]) => `<div class="it">${ic(i)}<span>${n}</span></div>`).join("") : "<p><em>Elle est vide pour l’instant.</em></p>");
$("#mx").onclick = () => $("#modal").hidden = true;
$("#bs").onclick = toggleSound;
$("#bc").onclick = () => { S.calm = !S.calm; save(); document.body.classList.toggle("calm", S.calm); $("#bc").textContent = "Calme : " + (S.calm ? "oui" : "non"); $("#bc").setAttribute("aria-pressed", S.calm); };

/* ===== MODE TEST : ouvrir index.html?dev=1 — SUPPRIMER CE BLOC AVANT LA MISE EN LIGNE ===== */
if (location.protocol === "file:" && new URLSearchParams(location.search).has("dev")) {
  const d = document.createElement("div"); d.id = "dev";
  d.innerHTML = [0, 1, 2, 3, 4, 5].map(i => `<button data-c="${i}">${i + 1}</button>`).join("") + `<button data-c="t">Voyage</button><button data-c="e">Fin</button><button data-c="r">Reset</button>`;
  d.onclick = e => { const k = e.target.dataset.c; if (k === undefined) return;
    if (k === "r") { localStorage.removeItem("chapitreXX-v2"); location.href = location.pathname + "?dev=1"; return; }
    S.stage = k === "t" ? "travel" : k === "e" ? "end" : "play"; if (!isNaN(k)) S.ch = +k; if (!S.name) S.name = "Test"; save(); render(); };
  document.body.append(d);
}

render();

</script>
</body>
